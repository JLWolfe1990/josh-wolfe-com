name: BizBuzz blog candidate quality

on:
  workflow_dispatch:
    inputs:
      publication_id:
        required: true
        type: string
      attempt:
        required: true
        type: string
      slug:
        required: true
        type: string
      candidate_hash:
        required: true
        type: string
      source_hash:
        required: true
        type: string
      image_hashes_json:
        required: true
        type: string
      expected_runner_version:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: bizbuzz-blog-quality-${{ inputs.publication_id }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - id: audit
        name: Build and audit exact candidate with installed runner
        run: node .bizbuzz/runner/audit.mjs
        env:
          BIZBUZZ_PUBLICATION_ID: ${{ inputs.publication_id }}
          BIZBUZZ_ATTEMPT: ${{ inputs.attempt }}
          BIZBUZZ_SLUG: ${{ inputs.slug }}
          BIZBUZZ_CANDIDATE_REF: ${{ github.ref_name }}
          BIZBUZZ_CANDIDATE_HASH: ${{ inputs.candidate_hash }}
          BIZBUZZ_SOURCE_HASH: ${{ inputs.source_hash }}
          BIZBUZZ_IMAGE_HASHES_JSON: ${{ inputs.image_hashes_json }}
          BIZBUZZ_EXPECTED_RUNNER_VERSION: ${{ inputs.expected_runner_version }}
      - name: Persist machine-readable result on candidate ref
        run: |
          git config user.name bizbuzz-quality[bot]
          git config user.email 254764050+bizbuzz-quality[bot]@users.noreply.github.com
          git add .bizbuzz-quality/
          git commit -m "quality: report ${{ inputs.publication_id }} attempt ${{ inputs.attempt }}"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: bizbuzz-blog-quality-${{ inputs.publication_id }}-${{ inputs.attempt }}
          path: |
            ${{ steps.audit.outputs.lighthouse_path }}
            ${{ steps.audit.outputs.report_path }}
          retention-days: 14
